summary: This document provides a comprehensive overview of calculus concepts, covering
  differentiation and integration techniques. Key topics include theorems on function
  monotonicity and extrema, inflection point classification, asymptote determination,
  curve sketching procedures, and integration methods such as substitution, integration
  by parts, and handling rational and trigonometric functions. It also details definite
  integrals, the Fundamental Theorem of Calculus, applications in area, volume, and
  arc length calculations, and concludes with an introduction to improper integrals
  and their convergence criteria.
