summary: This document is a comprehensive review of calculus concepts, covering inequalities
  like Cauchy-Schwarz and Minkowski, definitions of limits (including ε-N and ε-δ
  languages), properties of infinitesimals and infinities, continuity, differentiation
  (including rules, derivatives of hyperbolic functions, Leibniz formula, and parametric
  derivatives), and key theorems such as Fermat's Lemma, Rolle's Theorem, Lagrange
  Mean Value Theorem, and Cauchy Mean Value Theorem. It also includes trigonometric
  and hyperbolic identities, discussions on function continuity and discontinuity
  types, and methods like logarithmic differentiation. The content serves as a foundational
  recap for advanced calculus, emphasizing definitions, proofs, and practical applications.
