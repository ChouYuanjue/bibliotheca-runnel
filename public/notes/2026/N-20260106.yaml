summary: This document presents informal mathematics notes focused on calculus, specifically
  integration techniques, proofs, and formulas. Key topics include proofs involving
  integrals and derivatives, such as demonstrating inequalities like ∫|f''(x)/f(x)|dx
  > 4/(b-a) under given conditions, and establishing identities using symmetry and
  Taylor expansions. It covers the midpoint rule error term, integration by substitution
  examples (e.g., involving arctan and arcsin functions), and standard integral results
  for expressions like ∫1/(a + b cos x)dx over symmetric intervals, providing closed-form
  solutions. The Wallis formula derivation is also discussed, using recursive relations
  for integrals of sin^n x. Overall, the notes emphasize rigorous calculus proofs,
  integral evaluations, and applications of mean value theorems.
