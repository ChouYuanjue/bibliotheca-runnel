summary: 'This document is a set of informal mathematics notes focusing on linear
  algebra, specifically eigenvalue problems, matrix properties, and quadratic forms.
  Key topics include: properties of eigenvalues and eigenvectors for functions of
  matrices, inverses, and adjugates; diagonalization conditions; trace and determinant
  relationships; symmetric and orthogonal matrices; nilpotent matrices; quadratic
  form optimization; and basis transitions in linear spaces. Examples demonstrate
  applications such as computing determinants, ranks, and matrix constructions using
  eigenvalues, with proofs involving characteristic polynomials, orthogonality, and
  similarity transformations. Conclusions emphasize techniques for solving matrix
  equations, verifying definiteness, and handling coordinate changes.'
